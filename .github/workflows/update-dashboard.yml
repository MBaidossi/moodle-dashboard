name: Update Moodle Dashboard

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:          # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Write config.json from secret
        run: |
          cat > config.json << 'EOF'
          {
            "ics_url": "${{ secrets.MOODLE_ICS_URL }}",
            "timezone": "Asia/Jerusalem"
          }
          EOF

      - name: Generate dashboard
        run: python3 moodle_dashboard.py

      - name: Prepare publish folder (only the HTML, nothing else)
        run: |
          mkdir -p public
          cp dashboard.html public/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
